
<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>XAUUSD 計算ツール（連動版）</title>
<style>
  body{font-family:system-ui;max-width:720px;margin:24px auto;padding:0 14px}
  .card{border:1px solid #ccc;border-radius:10px;padding:14px;margin-bottom:10px}
  input{width:100%;padding:8px;margin:5px 0;font-size:16px}
  .out{font-size:24px;font-weight:bold;margin-top:8px}
</style>

<h2>XAUUSD 計算ツール</h2>

<div class="card">
  <label>USDJPY（円/ドル）</label>
<input id="usdjpy" type="number" step="0.001" min="0" value="154" />
<div id="fxStatus" style="font-size:12px;opacity:.7;margin-top:6px">未更新</div>

<script>
  // USDJPY 自動取得（MoneyConvert）
  const FX_URL = "https://cdn.moneyconvert.net/api/latest.json";
  const FX_UPDATE_MS = 5 * 60 * 1000; // 5分（API更新頻度に合わせる）

  async function fetchUsdJpy() {
    try {
      const res = await fetch(FX_URL, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();

      const jpy = data?.rates?.JPY; // 1 USD = ? JPY
      if (typeof jpy !== "number" || !isFinite(jpy) || jpy <= 0) {
        throw new Error("JPY rate not found");
      }

      const usdjpyEl = document.getElementById("usdjpy");
      usdjpyEl.value = jpy.toFixed(3);

      const st = document.getElementById("fxStatus");
      st.textContent = `自動更新: ${new Date().toLocaleString()}（USDJPY=${jpy.toFixed(3)}）`;
    } catch (e) {
      const st = document.getElementById("fxStatus");
      st.textContent = `自動更新失敗: ${new Date().toLocaleString()}（前回値を使用）`;
    }

    // 既存の計算を再実行（あなたのコード側の updateAll / update を呼ぶ）
    // 関数名が updateAll の場合:
    if (typeof updateAll === "function") updateAll();
    // 関数名が update の場合:
    if (typeof update === "function") update();
  }

  // 初回
  fetchUsdJpy();
  // 定期更新
  setInterval(fetchUsdJpy, FX_UPDATE_MS);
</script>
</div>

<div class="card">
  <h3>① ロット算出</h3>
  <label>耐えるドル数</label>
  <input id="d1" type="number" step="0.01">
  <label>証拠金（円）</label>
  <input id="yen1" type="number">
  <div class="out" id="lotOut">—</div>
</div>

<div class="card">
  <h3>④ 任意ドル変動での含み損益（①のロット使用）</h3>
  <label>ドル変動幅（例: +10 / -25）</label>
  <input id="move4" type="number" step="0.01">
  <div class="out" id="plOut">—</div>
</div>

<script>
const $ = id => document.getElementById(id);
const USD_PER_DOLLAR_PER_LOT = 100;

let calculatedLot = 0;

function update(){
  const usdjpy = parseFloat($("usdjpy").value);
  const D1 = parseFloat($("d1").value);
  const yen1 = parseFloat($("yen1").value);

  // ① ロット算出
  if(D1>0 && yen1>0){
    calculatedLot = (yen1/usdjpy)/(100*D1);
    $("lotOut").textContent = calculatedLot.toFixed(3)+" lot";
  }

  // ④ 損益計算（①のロット使用）
  const move = parseFloat($("move4").value);
  if(calculatedLot>0 && move){
    const plUsd = calculatedLot*100*move;
    const plYen = plUsd*usdjpy;
    $("plOut").textContent =
      plUsd.toFixed(1)+" USD / "+
      plYen.toFixed(0)+" 円";
  }
}

["usdjpy","d1","yen1","move4"]
.forEach(id=>$(id).addEventListener("input",update));

update();
</script>
